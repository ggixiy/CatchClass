spring:
  application:
    name: catchclass
  profiles:
    # Локально за замовчуванням підхоплюється application-local.yml (його немає в git); на сервері профіль задає docker-compose.
    default: local
  datasource:
    url: jdbc:postgresql://localhost:5433/catchclass
    username: catchclass
    password: catchclass
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

catchclass:
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    password-reset-ttl: 1h
  notification:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  livekit:
    url: ${LIVEKIT_URL}
    api-key: ${LIVEKIT_API_KEY}
    api-secret: ${LIVEKIT_API_SECRET}

server:
  # Caddy стоїть перед застосунком: реальна IP клієнта береться з X-Forwarded-For (потрібно для лімітів)
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: 10MB